project_id = "peak-unemployment"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5174/auth/callback", "http://localhost:5173/auth/callback", "http://127.0.0.1:5173/app/settings"]
minimum_password_length = 12
enable_anonymous_sign_ins = true
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
[realtime]
enabled = true
